<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV Años ✨</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Georgia,serif;
  background:#080812;
  color:white;
  text-align:center;
}

.music{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1000;
}

.music button{
  border:none;
  border-radius:50px;
  padding:13px 20px;
  background:rgba(255,255,255,.9);
  color:#111;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,255,255,.4);
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 20px;
  background:
    linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.7)),
    url("foto.jpg") center/cover no-repeat;
}

.card{
  width:min(600px,95%);
  padding:45px 25px;
  border-radius:30px;
  background:rgba(10,10,20,.62);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 0 45px rgba(255,255,255,.18);
}

.small{
  font-size:18px;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1{
  font-size:55px;
  margin:20px 0 10px;
  text-shadow:0 0 20px rgba(255,255,255,.5);
}

.name{
  font-size:30px;
  margin:15px 0 25px;
}

.line{
  width:100px;
  height:2px;
  background:white;
  margin:25px auto;
}

.message{
  font-size:18px;
  line-height:1.7;
}

.info{
  margin-top:35px;
  font-size:18px;
  line-height:1.8;
}

.button{
  display:inline-block;
  margin-top:30px;
  padding:14px 28px;
  border-radius:30px;
  color:#111;
  background:white;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:500px){
  h1{
    font-size:42px;
  }

  .name{
    font-size:25px;
  }
}
</style>
</head>

<body>
<audio id="musicAudio" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>
<div class="music">
  <button onclick="toggleMusic()" id="musicBtn">▶️ Música</button>
</div>

<section class="hero">

  <div class="card">

    <div class="small">Mis XV Años</div>

    <h1>✨ XV ✨</h1>

    <div class="line"></div>

    <div class="name">
      Edgar Tadeo Fernández Esparza
    </div>

    <p class="message">
      Hay momentos en la vida que merecen ser celebrados
      de una manera muy especial.
      <br><br>
      Me encantaría compartir contigo
      este día tan importante para mí.
    </p>

    <div class="line"></div>

    <div class="info">
      📅 <b>Fecha</b><br>
      Próximamente
      <br><br>

      📍 <b>Lugar</b><br>
      Próximamente
      <br><br>

      🕐 <b>Hora</b><br>
      Próximamente
    </div>

    <a href="#confirmar" class="button">
      💌 Confirmar asistencia
    </a>

  </div>

</section>

<script>
const audio = document.getElementById("musicAudio");
const button = document.getElementById("musicBtn");

function toggleMusic(){
  if(audio.paused){
    audio.play();
    button.innerHTML = "⏸️ Pausar";
  }else{
    audio.pause();
    button.innerHTML = "▶️ Música";
  }
}
</script>

</body>
</html>
